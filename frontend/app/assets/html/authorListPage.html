<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>EksiEngelPlus - Yazar Listesi</title>
  <link rel="stylesheet" href="../css/buttons.css">
  <link rel="stylesheet" href="../css/footer.css">
  <link rel="stylesheet" href="../css/customNotification.css">
</head>
<body>

<div class="container">
  <!-- Header Section -->
  <header class="main-header">
    <div class="header-content">
      <div class="header-text">
        <div class="logo-section">
          <img src="../img/eksiengel128.png" style="height: 32px; width: 32px; border: 2px solid rgba(255,255,255,0.8); border-radius: 4px; background: rgba(255,255,255,0.1);">
          <h1>EksiEngel Plus</h1>
          <span class="subtitle">· Yazar Listesi İşlemleri</span>
        </div>
      </div>
      <div class="header-actions">
        <a href="faq.html" class="help-btn-compact">
          <span class="btn-icon">❓</span>
          <span class="btn-text">Yardım</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Main Content Card -->
  <section class="card">
    <div class="card-header">
      <h2>📝 Yazar Listesi</h2>
    </div>
    <p class="card-desc">Listeye yazdığınız yazarları toplu olarak engelleyin veya engellerini kaldırın.</p>
    
    <div class="card-body">
      <textarea 
        id="userList" 
        placeholder="ornek_yazar_1&#10;ornek_yazar_2&#10;ornek_yazar_3&#10;"
        style="width: 100%; height: 200px; padding: 12px; font-size: 14px; border: 2px solid var(--border-color); border-radius: 8px; background: var(--bg-color); color: var(--text-primary); resize: vertical; box-sizing: border-box;"></textarea>
    </div>
    
    <input type="file" id="csvFileInput" accept=".csv" style="display:none">
    
    <div class="action-section">
      <button id="importCSV" class="btn btn-secondary">📄 CSV Yükle</button>
      <button id="startBan" class="btn btn-success">🚫 Engelle</button>
      <button id="startUndoban" class="btn btn-danger">🔓 Engel Kaldır</button>
    </div>
    
    <p id="status" style="text-align: center; margin-top: 12px; color: var(--text-muted);"></p>
  </section>
</div>

<script type="module" src="../js/authorListPage.js"></script>
</body>
</html>

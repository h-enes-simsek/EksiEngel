<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../css/buttons.css">
<link rel="stylesheet" href="../css/customPopup.css">
<style>
#title{text-align:center;font-family:'Montserrat',sans-serif;font-size:25px;}
img{display:block;margin-left:auto;margin-right:auto;margin-bottom:10px;}
</style>
</head>
<body>
<p id="title">EksiEngelPlus</p>
<img src="../img/eksiengel128.png">
<div class="button-section">
  <button id="openNotification" class="btn btn-dark btn-green-candy">Ana İşlemler</button>
</div>
<div class="button-section">
  <button id="openFaq" class="btn btn-dark btn-green-candy">Ayarlar ve Yardım</button>
</div>

<!-- Date Filter Section -->
<div id="dateFilterSection" class="date-filter-section">
  <div class="date-filter-header">
    <span class="date-filter-title">Tarih Filtresi</span>
    <label class="switch">
      <input type="checkbox" id="enableDateFilter">
      <span class="slider round"></span>
    </label>
  </div>
  <div id="dateFilterStatus" class="date-filter-status"></div>
  <button id="configureDateFilter" class="btn btn-small btn-configure" style="display:none;">Filtreleri Yapılandır</button>
</div>

<div id="popupStatus"></div>
<script type="module" src="../js/popup.js"></script>
</body>
</html>

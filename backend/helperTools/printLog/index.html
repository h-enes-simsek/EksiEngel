<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>EksiEngel Log Inspector</title>
    <style>
        :root {
            --bg: #090d16;
            --surface: rgba(19, 27, 43, 0.82);
            --border: rgba(148, 163, 184, 0.16);
            --border-bright: rgba(148, 163, 184, 0.28);
            --text: #e8edf7;
            --muted: #8d9ab0;
            --accent: #7dd3fc;
            --info: #67e8f9;
            --warning: #fbbf24;
            --error: #fb7185;
            --radius: 18px;
            --shadow: 0 24px 70px rgba(0, 0, 0, 0.32);
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            color: var(--text);
            background:
                radial-gradient(circle at 12% 0%, rgba(14, 165, 233, 0.14), transparent 32rem),
                radial-gradient(circle at 92% 18%, rgba(139, 92, 246, 0.11), transparent 30rem),
                var(--bg);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        button, textarea { font: inherit; }

        .page {
            width: min(1180px, calc(100% - 32px));
            margin: 0 auto;
            padding: 64px 0;
        }

        .hero {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 32px;
            margin-bottom: 28px;
        }

        .eyebrow {
            margin-bottom: 10px;
            color: var(--accent);
            font-size: 0.72rem;
            font-weight: 750;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(2rem, 5vw, 3.5rem);
            line-height: 0.98;
            letter-spacing: -0.055em;
        }

        .hero p {
            max-width: 430px;
            margin: 0;
            color: var(--muted);
            line-height: 1.65;
        }

        .panel {
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface);
            box-shadow: var(--shadow);
            backdrop-filter: blur(18px);
        }

        .input-panel {
            margin-bottom: 20px;
            padding: 20px;
        }

        .panel-header, .input-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .panel-header { margin-bottom: 14px; }

        .panel-title {
            margin: 0;
            font-size: 0.92rem;
            font-weight: 700;
        }

        .clear-button {
            padding: 7px 11px;
            border: 1px solid var(--border);
            border-radius: 9px;
            color: var(--muted);
            background: rgba(255, 255, 255, 0.025);
            cursor: pointer;
            transition: 160ms ease;
        }

        .clear-button:hover {
            border-color: var(--border-bright);
            color: var(--text);
            background: rgba(255, 255, 255, 0.06);
        }

        .clear-button:focus-visible, textarea:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        textarea {
            display: block;
            width: 100%;
            min-height: 168px;
            resize: vertical;
            padding: 17px 18px;
            border: 1px solid var(--border);
            border-radius: 12px;
            color: #cbd5e1;
            background: rgba(5, 9, 17, 0.72);
            font-family: "Cascadia Code", "SFMono-Regular", Consolas, monospace;
            font-size: 0.83rem;
            line-height: 1.65;
            transition: border-color 160ms ease, box-shadow 160ms ease;
        }

        textarea::placeholder { color: #536077; }

        textarea:focus {
            border-color: rgba(125, 211, 252, 0.58);
            box-shadow: 0 0 0 4px rgba(125, 211, 252, 0.07);
        }

        .input-footer {
            margin-top: 12px;
            color: var(--muted);
            font-size: 0.78rem;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 7px;
        }

        .status::before {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #475569;
            content: "";
        }

        .status.has-entries::before {
            background: #34d399;
            box-shadow: 0 0 12px rgba(52, 211, 153, 0.65);
        }

        .table-header {
            padding: 20px 22px;
            border-bottom: 1px solid var(--border);
        }

        .table-wrap { overflow-x: auto; }

        table {
            width: 100%;
            min-width: 760px;
            border-collapse: collapse;
        }

        th, td {
            padding: 15px 18px;
            border-bottom: 1px solid var(--border);
            text-align: left;
            vertical-align: top;
        }

        th {
            color: var(--muted);
            background: rgba(6, 10, 18, 0.34);
            font-size: 0.68rem;
            font-weight: 750;
            letter-spacing: 0.11em;
            text-transform: uppercase;
        }

        th:first-child, td:first-child { width: 100px; }
        th:nth-child(2), td:nth-child(2) { width: 225px; }
        th:nth-child(3), td:nth-child(3) { width: 150px; }

        td {
            color: #cbd5e1;
            font-size: 0.84rem;
            line-height: 1.55;
        }

        td:nth-child(2), td:nth-child(3) {
            color: #9aa8bd;
            font-family: "Cascadia Code", "SFMono-Regular", Consolas, monospace;
            font-size: 0.78rem;
        }

        tbody tr { transition: background-color 140ms ease; }
        tbody tr:hover { background: rgba(255, 255, 255, 0.025); }
        tbody tr:last-child td { border-bottom: 0; }
        .row-warning { background: rgba(251, 191, 36, 0.045); }
        .row-error { background: rgba(251, 113, 133, 0.055); }

        .severity {
            display: inline-flex;
            min-width: 52px;
            justify-content: center;
            padding: 4px 8px;
            border: 1px solid currentColor;
            border-radius: 999px;
            font-family: "Cascadia Code", "SFMono-Regular", Consolas, monospace;
            font-size: 0.68rem;
            font-weight: 800;
            letter-spacing: 0.06em;
        }

        .severity-info { color: var(--info); background: rgba(103, 232, 249, 0.08); }
        .severity-warning { color: var(--warning); background: rgba(251, 191, 36, 0.09); }
        .severity-error { color: var(--error); background: rgba(251, 113, 133, 0.09); }

        .empty-state td {
            height: 180px;
            color: var(--muted);
            text-align: center;
            vertical-align: middle;
        }

        @media (max-width: 720px) {
            .page {
                width: min(100% - 20px, 1180px);
                padding: 36px 0;
            }

            .hero { display: block; }
            .hero p { margin-top: 16px; }
            .input-panel { padding: 14px; }
            .input-footer > span:last-child { display: none; }
        }
    </style>
</head>
<body>
    <main class="page">
        <header class="hero">
            <div>
                <div class="eyebrow">EksiEngel developer utility</div>
                <h1>Log Inspector</h1>
            </div>
            <p>Paste raw extension logs and turn them into a clean, scannable timeline of events.</p>
        </header>

        <section class="panel input-panel" aria-labelledby="raw-logs-title">
            <div class="panel-header">
                <h2 class="panel-title" id="raw-logs-title">Raw logs</h2>
                <button class="clear-button" type="button" onclick="clearLogs()">Clear</button>
            </div>
            <textarea
                id="logTextArea"
                aria-label="Raw log data"
                spellcheck="false"
                placeholder="2026_09_06_14_30_45_123 INF [bg] Extension initialized"
                oninput="changeText(this)"
            ></textarea>
            <div class="input-footer">
                <span class="status" id="entryCount" aria-live="polite">Waiting for logs</span>
                <span>Newline and legacy comma separators supported</span>
            </div>
        </section>

        <section class="panel" aria-labelledby="parsed-events-title">
            <div class="table-header">
                <h2 class="panel-title" id="parsed-events-title">Parsed events</h2>
            </div>
            <div class="table-wrap">
                <table id="logTable">
                    <thead>
                        <tr>
                            <th>Severity</th>
                            <th>Timestamp</th>
                            <th>Source</th>
                            <th>Message</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        const logTableBody = document.querySelector('#logTable tbody');
        const entryCount = document.getElementById('entryCount');
        const logTextArea = document.getElementById('logTextArea');

        function showEmptyState(message = 'Paste logs above to start inspecting events.')
        {
            logTableBody.innerHTML = '';
            const row = logTableBody.insertRow();
            row.className = 'empty-state';
            const cell = row.insertCell();
            cell.colSpan = 4;
            cell.textContent = message;
        }

        function updateEntryCount(count)
        {
            entryCount.textContent = count === 0
                ? 'Waiting for logs'
                : `${count} ${count === 1 ? 'event' : 'events'} parsed`;
            entryCount.classList.toggle('has-entries', count > 0);
        }

        function clearLogs()
        {
            logTextArea.value = '';
            updateEntryCount(0);
            showEmptyState();
            logTextArea.focus();
        }

        function changeText(field)
        {
            logTableBody.innerHTML = '';

            // Current format: 2026_09_06_14_30_45_123 INF [source] message
            // Current telemetry logs are newline-separated. Comma-separated logs from
            // older versions are supported as well.
            const timestampPattern = '\\d{4}_\\d{2}_\\d{2}_\\d{2}_\\d{2}_\\d{2}_\\d{3}';
            const logEntryPattern = new RegExp(
                `(${timestampPattern})\\s+(INFO|INF|WARN|WRN|ERR)\\s+\\[([^\\]]*)\\]\\s*` +
                `([\\s\\S]*?)(?=(?:,|\\r?\\n)?\\s*${timestampPattern}\\s+(?:INFO|INF|WARN|WRN|ERR)\\s+\\[|$)`,
                'g'
            );

            let count = 0;
            for (const match of field.value.matchAll(logEntryPattern)) {
                const [, timestamp, severity, source, message] = match;
                const row = logTableBody.insertRow();

                const severityCell = row.insertCell();
                const severityBadge = document.createElement('span');
                severityBadge.className = 'severity';
                severityBadge.textContent = severity;
                severityCell.appendChild(severityBadge);

                for (const value of [timestamp, source, message.trim()]) {
                    const cell = row.insertCell();
                    cell.textContent = value;
                }

                if (severity === 'ERR') {
                    row.className = 'row-error';
                    severityBadge.classList.add('severity-error');
                } else if (severity === 'WRN' || severity === 'WARN') {
                    row.className = 'row-warning';
                    severityBadge.classList.add('severity-warning');
                } else {
                    severityBadge.classList.add('severity-info');
                }

                count++;
            }

            updateEntryCount(count);

            if (count === 0) {
                showEmptyState(field.value.trim()
                    ? 'No valid log entries found. Check the expected format.'
                    : 'Paste logs above to start inspecting events.');
            }
        }

        showEmptyState();
    </script>
</body>
</html>
